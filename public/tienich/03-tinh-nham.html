<style>
:root{--bg:#edf9f5;--paper:#fff;--brand:#1268a8;--good:#237a45;--wrong:#bd6b32;--ink:#182a35;--line:#cfe5dd}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Arial,sans-serif}.app{max-width:960px;margin:auto;padding:12px;min-height:700px}.panel,.stage,.status{background:var(--paper);border:2px solid var(--line);border-radius:20px;box-shadow:0 6px 0 #dbece7}.panel{padding:16px}.top{display:flex;gap:12px;align-items:center;margin-bottom:14px}.mark{width:46px;height:46px;border-radius:14px;background:#dcefff;color:var(--brand);display:grid;place-items:center;font-weight:900;font-size:26px}.top h1{font-size:24px;margin:0}.top p{margin:2px 0 0;color:#52636b}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:grid;gap:5px}.field label{font-size:13px;font-weight:700}.field select,.field input{min-height:48px;width:100%;border:2px solid #b8d7cb;border-radius:12px;padding:8px;font-size:16px;background:#fff}.field.wide{grid-column:1/-1}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mode{min-height:48px;border:2px solid #b8d7cb;border-radius:12px;background:#fff;font-weight:700;color:var(--ink);padding:6px}.mode[aria-pressed=true]{border-color:var(--brand);background:#eaf6ff;color:#07568e}.btn{min-height:50px;border:0;border-radius:13px;padding:10px 15px;font-size:16px;font-weight:800;cursor:pointer}.primary{background:var(--brand);color:#fff}.secondary{background:#fff;color:var(--brand);border:2px solid var(--brand)}.stage{margin-top:15px;padding:22px;min-height:385px;display:grid;align-content:center;text-align:center}.progress{display:flex;justify-content:space-between;gap:10px;color:#52636b;font-weight:700;font-size:14px}.question{font-size:54px;font-weight:900;letter-spacing:1px;font-variant-numeric:tabular-nums;margin:24px 0 18px;min-height:78px}.answer{display:block;margin:0 auto;width:min(270px,100%);height:62px;border:3px solid #9fc9df;border-radius:15px;font-size:32px;text-align:center;font-weight:800;color:var(--ink);outline:none}.answer:focus{border-color:var(--brand);box-shadow:0 0 0 4px #cbeaff}.message{height:28px;margin:12px 0;color:#52636b;font-weight:700}.message.good{color:var(--good)}.message.retry{color:var(--wrong)}.keypad{width:min(360px,100%);display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:auto}.keypad button{min-height:50px;border:2px solid #b8d7cb;border-radius:12px;background:#fff;font-size:22px;font-weight:800;color:var(--ink)}.keypad button.action{font-size:15px;color:var(--brand)}.status{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:15px;padding:12px 16px;font-weight:700}.result{display:none;text-align:left;max-width:620px;margin:auto}.result h2{margin-top:0;font-size:28px}.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{border:2px solid var(--line);border-radius:12px;padding:10px;text-align:center}.metric b{display:block;font-size:25px;color:var(--brand)}.mistakes{margin-top:14px;padding:12px;background:#fff8f1;border:2px solid #f0c8a8;border-radius:12px}.mistakes ul{margin:7px 0 0;padding-left:22px}.result-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.shake{animation:shake .3s linear}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}@media(min-width:720px){.fields{grid-template-columns:repeat(4,1fr)}.field.wide{grid-column:span 2}.app{padding:22px}.stage{min-height:470px}.question{font-size:72px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style></head><body><main class="app"><section class="panel" aria-label="Cài đặt luyện tính nhẩm"><div class="top"><div class="mark" aria-hidden="true">+</div><div><h1>Luyện tính nhẩm</h1><p>Làm nhanh, hiểu đúng, không tạo áp lực.</p></div></div><div class="fields"><div class="field"><label for="grade">Lớp</label><select id="grade"><option value="1">Lớp 1</option><option value="2">Lớp 2</option><option value="3" selected>Lớp 3</option><option value="4">Lớp 4</option><option value="5">Lớp 5</option></select></div><div class="field"><label for="operation">Phép tính</label><select id="operation"><option value="mix">Hỗn hợp</option><option value="add">Cộng</option><option value="sub">Trừ</option><option value="mul">Nhân</option><option value="div">Chia</option></select></div><div class="field"><label for="count">Số câu luyện tập</label><select id="count"><option value="10">10 câu</option><option value="20" selected>20 câu</option><option value="30">30 câu</option></select></div><div class="field wide"><label>Chế độ</label><div class="modes"><button class="mode" data-mode="practice" aria-pressed="true">Luyện tập</button><button class="mode" data-mode="speed" aria-pressed="false">Tốc độ · 60 giây</button><button class="mode" data-mode="survival" aria-pressed="false">Sinh tồn · 3 lượt</button></div></div></div><p style="margin:14px 0 0"><button class="btn primary" id="start">Bắt đầu phiên luyện</button></p></section><section class="stage" aria-live="polite"><div id="ready"><strong style="font-size:24px">Sẵn sàng chưa?</strong><p>Chọn cài đặt rồi bấm bắt đầu.</p></div><div id="quiz" hidden><div class="progress"><span id="progressText">Câu 1</span><span id="timerText">Không giới hạn</span></div><div class="question" id="question">7 + 5 =</div><input class="answer" id="answer" inputmode="numeric" autocomplete="off" aria-label="Nhập đáp án"><div class="message" id="message"></div><div class="keypad" aria-label="Bàn phím số"><button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button><button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button><button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button><button class="action" data-key="clear">Xóa</button><button data-key="0">0</button><button class="action" data-key="enter">Xác nhận</button></div></div><div class="result" id="result"></div></section><footer class="status"><span id="statusText">Chưa bắt đầu phiên luyện.</span><button class="btn secondary" id="restart">Làm lại</button></footer></main><script>
(()=>{'use strict';const $=s=>document.getElementById(s),state={mode:'practice',questions:[],index:0,correct:0,wrong:[],tries:0,start:0,timer:null,seconds:0,finished:false};const r=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function max(){return {1:10,2:100,3:100,4:1000,5:1000}[$('grade').value]};function selectedOp(){const o=$('operation').value;if(o!=='mix')return o;const g=+$('grade').value;return ['add','sub',...(g>=2?['mul','div']:[])][r(0,g>=2?3:1)]}function question(){let a,b,op=selectedOp(),m=max();if(op==='add'){a=r(2,Math.floor(m*.7));b=r(2,Math.floor(m*.6));return{t:`${a} + ${b} =`,a:a+b}}if(op==='sub'){a=r(4,m);b=r(2,a-1);return{t:`${a} − ${b} =`,a:a-b}}if(op==='mul'){a=r(2,9);b=r(2,+$('grade').value>=4?20:10);return{t:`${a} × ${b} =`,a:a*b}}b=r(2,9);a=b*r(2,+$('grade').value>=4?30:10);return{t:`${a} : ${b} =`,a:a/b}}
function build(){const total=+$('count').value;state.questions=Array.from({length:state.mode==='speed'?99:total},question);state.index=state.correct=state.tries=state.seconds=0;state.wrong=[];state.finished=false;state.start=Date.now();$('ready').hidden=true;$('result').style.display='none';$('quiz').hidden=false;next();if(state.mode==='speed'){state.timer=setInterval(()=>{state.seconds++;$('timerText').textContent=`Còn ${Math.max(0,60-state.seconds)} giây`;if(state.seconds>=60)finish()},1000)}}function next(){if(state.finished)return;if(state.mode==='practice'&&state.index>=state.questions.length)return finish();$('answer').value='';$('message').textContent='';state.tries=0;const q=state.questions[state.index];$('question').textContent=q.t;$('progressText').textContent=state.mode==='speed'?`Đã làm ${state.index} câu`:state.mode==='survival'?`Đúng ${state.correct} · Lượt sai ${state.wrong.length}/3`:`Câu ${state.index+1}/${state.questions.length}`;$('timerText').textContent=state.mode==='speed'?`Còn ${60-state.seconds} giây`:'Không giới hạn';$('answer').focus()}function submit(){if(state.finished||!$('answer').value.trim())return;const q=state.questions[state.index],value=Number($('answer').value);if(value===q.a){state.correct++;$('message').className='message good';$('message').textContent='Đúng rồi! Sang câu tiếp theo nhé.';state.index++;setTimeout(next,reduce?0:300);return}state.tries++;if(state.tries===1){$('message').className='message retry';$('message').textContent='Chưa đúng, thử lại nhé.';$('answer').classList.remove('shake');void $('answer').offsetWidth;$('answer').classList.add('shake');return}state.wrong.push({...q,your:value});$('message').className='message retry';$('message').textContent=`Đáp án là ${q.a}. Mình cùng làm câu khác nhé.`;state.index++;if(state.mode==='survival'&&state.wrong.length>=3)setTimeout(finish,reduce?0:700);else setTimeout(next,reduce?0:700)}function finish(){if(state.finished)return;state.finished=true;clearInterval(state.timer);$('quiz').hidden=true;const total=state.index,avg=total?Math.round((Date.now()-state.start)/1000/total):0;const wrong=state.wrong.length?`<div class="mistakes"><b>Câu cần luyện thêm</b><ul>${state.wrong.map(x=>`<li>${x.t} ${x.a}</li>`).join('')}</ul></div>`:'<p style="color:var(--good);font-weight:700">Tuyệt vời, phiên này chưa có câu cần xem lại.</p>';$('result').innerHTML=`<h2>Hoàn thành phiên luyện</h2><div class="result-grid"><div class="metric"><b>${state.correct}</b>câu đúng</div><div class="metric"><b>${total}</b>câu đã làm</div><div class="metric"><b>${avg}s</b>trung bình/câu</div></div>${wrong}<div class="result-actions"><button class="btn primary" id="again">Luyện lại</button><button class="btn secondary" id="onlyWrong" ${state.wrong.length?'':'disabled'}>Luyện lại câu sai</button></div>`;$('result').style.display='block';$('statusText').textContent=`Phiên luyện kết thúc: ${state.correct}/${total} câu đúng.`;$('again').onclick=build;const only=$('onlyWrong');if(only)only.onclick=()=>{if(!state.wrong.length)return;state.questions=state.wrong.map(x=>({t:x.t,a:x.a}));state.mode='practice';state.index=state.correct=state.tries=0;state.wrong=[];state.finished=false;state.start=Date.now();$('result').style.display='none';$('quiz').hidden=false;next()}}
document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;document.querySelectorAll('.mode').forEach(x=>x.setAttribute('aria-pressed',x===b));});$('start').onclick=build;$('restart').onclick=build;$('answer').addEventListener('keydown',e=>{if(e.key==='Enter')submit()});document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{const k=b.dataset.key;if(k==='enter')submit();else if(k==='clear')$('answer').value=$('answer').value.slice(0,-1);else $('answer').value+=k;$('answer').focus()});
})();
</script></body></html>
