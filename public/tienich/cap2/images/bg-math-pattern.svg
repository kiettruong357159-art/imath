    <!-- Circle with radius -->
    <circle cx="80" cy="345" r="25" />
    <line x1="80" y1="345" x2="100" y2="330" />

    <!-- Abacus / Grid dots -->
    <circle cx="180" cy="340" r="2" fill="#0284c7" />
    <circle cx="195" cy="340" r="2" fill="#0284c7" />
    <circle cx="210" cy="340" r="2" fill="#0284c7" />
    <circle cx="180" cy="355" r="2" fill="#0284c7" />
    <circle cx="195" cy="355" r="2" fill="#0284c7" />
    <circle cx="210" cy="355" r="2" fill="#0284c7" />

    <!-- Angle theta -->
    <path d="M 280 365 L 320 365 M 280 365 L 310 335" />
    <path d="M 298 365 A 18 18 0 0 0 300 345" />
