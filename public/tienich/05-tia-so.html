-width:2}.work{max-width:470px;margin:12px auto;display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}.work input,.work select{height:48px;border:2px solid #9fc9df;border-radius:12px;padding:6px;font-size:18px;font-weight:800;width:100px}.hint{text-align:center;color:#52636b}.slider{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;max-width:500px;margin:16px auto}.slider input{accent-color:var(--brand)}.number{font-size:30px;font-weight:900;color:var(--brand);min-width:45px;text-align:center}.status{margin-top:15px;padding:12px 15px;display:flex;justify-content:space-between;gap:10px;font-weight:700}.hidden{display:none}@media(min-width:720px){.app{padding:22px}.fields{grid-template-columns:repeat(4,1fr)}.field.wide{grid-column:span 2}.canvas{padding:25px}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><main class="app"><section class="panel"><div class="head"><div class="mark">→</div><div><h1>Tia số tương tác</h1><p>Nhìn từng bước nhảy để hiểu phép cộng và phép trừ.</p></div></div><div class="fields"><div class="field"><label for="range">Phạm vi</label><select id="range"><option value="10">0–10</option><option value="20" selected>0–20</option><option value="100">0–100</option></select></div><div class="field"><label for="start">Số bắt đầu</label><input id="start" type="number" inputmode="numeric" value="7" min="0"></div><div class="field"><label for="op">Phép tính</label><select id="op"><option value="+">Cộng (+)</option><option value="-">Trừ (−)</option></select></div><div class="field"><label for="step">Số bước</label><input id="step" type="number" inputmode="numeric" value="5" min="1"></div><div class="field wide"><label>Chế độ</label><div class="modes"><button class="active" data-mode="jump">Xem bước nhảy</button><button data-mode="reverse">Đoán phép tính</button><button data-mode="free">Tự do khám phá</button></div></div></div><p style="margin:14px 0 0"><button class="btn" id="run">Xem trên tia số</button></p></section><section class="canvas"><div class="prompt" id="prompt">7 + 5 = 12</div><div class="svgbox"><svg id="svg" viewBox="0 0 760 240" role="img" aria-label="Tia số tương tác"></svg></div><div id="jumpWork" class="work"><span>7 + 5 =</span><strong id="resultNumber">12</strong></div><div id="reverseWork" class="work hidden"><span>Điền phép tính:</span><input id="guessStart" inputmode="numeric" aria-label="Số bắt đầu"><select id="guessOp" aria-label="Dấu phép tính"><option value="+">+</option><option value="-">−</option></select><input id="guessStep" inputmode="numeric" aria-label="Số bước"><button class="btn" id="check">Kiểm tra</button></div><div id="freeWork" class="hidden"><div class="slider"><input id="slider" type="range" min="0" max="20" value="0"><span class="number" id="freeNumber">0</span></div><p class="hint">Kéo thanh trượt để di chuyển chấm tròn trên tia số.</p></div><p class="hint" id="hint">Mỗi cung là một bước nhảy. Cộng nhảy sang phải, trừ nhảy sang trái.</p></section><footer class="status"><span id="status">Đang ở chế độ xem bước nhảy.</span><span>Không lưu dữ liệu</span></footer></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),S={mode:'jump',range:20,start:7,op:'+',step:5,result:12,reverse:null,tries:0};const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));function x(n){return 45+n/(S.range||1)*670}function valid(){S.range=+$('range').value;S.start=clamp(+$('start').value||0,0,S.range);S.step=clamp(+$('step').value||1,1,S.range);S.op=$('op').value;if(S.op==='+'&&S.start+S.step>S.range)S.step=Math.max(1,S.range-S.start);if(S.op==='-'&&S.step>S.start)S.step=Math.max(1,S.start);S.result=S.op==='+'?S.start+S.step:S.start-S.step;$('start').value=S.start;$('step').value=S.step}function base(){let h=`<line class="axis" x1="35" y1="170" x2="730" y2="170"/><path d="M730 170l-12-7v14z" fill="#294451"/>`;const every=S.range===100?10:1;for(let i=0;i<=S.range;i++){if(S.range===100&&i%10!==0){h+=`<line class="minor" x1="${x(i)}" y1="164" x2="${x(i)}" y2="176"/>`;continue}h+=`<line class="tick" x1="${x(i)}" y1="158" x2="${x(i)}" y2="182"/><text class="label" x="${x(i)}" y="208">${i}</text>`}return h}function arc(from,to,index,negative=false){const a=x(from),b=x(to),mid=(a+b)/2,height=48+index%2*15;return `<path class="arc ${negative?'minus':''}" d="M${a} 160 Q${mid} ${160-height} ${b} 160"/><text class="label" x="${mid}" y="${145-height}">${negative?'−1':'+1'}</text>`}function drawJump(showAll=true){let h=base(),current=S.start;h+=`<circle class="dot" cx="${x(current)}" cy="160" r="13"/>`;for(let i=0;i<S.step;i++){const next=current+(S.op==='+'?1:-1);if(showAll||i===S.step-1)h+=arc(current,next,i,S.op==='-');current=next}h+=`<circle class="dot" cx="${x(showAll?S.result:S.start)}" cy="160" r="13"/>`;$('svg').innerHTML=h}function animate(){drawJump(false);if(reduced||S.step>25){drawJump(true);return}let i=0,current=S.start;const timer=setInterval(()=>{i++;const next=current+(S.op==='+'?1:-1);let h=base();for(let j=0;j<i;j++){const a=S.start+(S.op==='+'?j:-j),b=a+(S.op==='+'?1:-1);h+=arc(a,b,j,S.op==='-')}h+=`<circle class="dot" cx="${x(next)}" cy="160" r="13"/>`;$('svg').innerHTML=h;current=next;if(i>=S.step)clearInterval(timer)},350)}function run(){valid();$('jumpWork').classList.toggle('hidden',S.mode!=='jump');$('reverseWork').classList.toggle('hidden',S.mode!=='reverse');$('freeWork').classList.toggle('hidden',S.mode!=='free');if(S.mode==='jump'){$('prompt').textContent=`${S.start} ${S.op==='+'?'+':'−'} ${S.step} = ${S.result}`;$('resultNumber').textContent=S.result;$('hint').textContent='Mỗi cung là một bước nhảy. Cộng nhảy sang phải, trừ nhảy sang trái.';animate()}else if(S.mode==='reverse'){makeReverse()}else free()}function makeReverse(){const m=+$('range').value,op=Math.random()<.5?'+':'-',step=Math.floor(Math.random()*Math.max(2,m/3))+1,start=op==='+'?Math.floor(Math.random()*(m-step+1)):Math.floor(Math.random()*(m-step+1))+step;S.reverse={start,op,step,result:op==='+'?start+step:start-step};S.range=m;S.start=start;S.op=op;S.step=step;S.result=S.reverse.result;S.tries=0;drawJump(true);$('prompt').textContent=`Con thỏ bắt đầu ở ${start} và kết thúc ở ${S.result}. Điền phép tính.`;$('guessStart').value='';$('guessStep').value='';$('hint').textContent='Quan sát hướng nhảy và số bước rồi điền phép tính.'}function check(){const q=S.reverse;const ok=+$('guessStart').value===q.start&&$('guessOp').value===q.op&&+$('guessStep').value===q.step;if(ok){$('hint').textContent='Đúng rồi! Bạn đã đọc tia số chính xác.';$('hint').style.color='var(--good)';return}S.tries++;$('hint').style.color='var(--wrong)';$('hint').textContent=S.tries>=2?`Phép tính đúng là ${q.start} ${q.op} ${q.step} = ${q.result}.`:'Chưa đúng, thử lại nhé.'}function free(){S.range=+$('range').value;$('slider').max=S.range;$('slider').value=clamp(+$('slider').value,0,S.range);$('prompt').textContent='Kéo chấm tròn trên tia số';$('hint').textContent='Mỗi vị trí trên tia số biểu diễn một số.';drawFree(+$('slider').value)}function drawFree(n){let h=base()+`<circle class="dot" cx="${x(n)}" cy="160" r="14"/><rect class="bubble" x="${x(n)-22}" y="84" rx="12" width="44" height="34"/><text class="label" x="${x(n)}" y="107">${n}</text>`;$('svg').innerHTML=h;$('freeNumber').textContent=n}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{S.mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));$('status').textContent=`Đang ở chế độ ${b.textContent}.`;run()});$('run').onclick=run;$('check').onclick=check;$('slider').oninput=e=>drawFree(+e.target.value);['range','start','op','step'].forEach(id=>$(id).onchange=()=>{if(S.mode==='jump')run()});run()})();
</script></body></html>
