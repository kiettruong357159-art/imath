    <!-- Pi -->
    <path d="M 330 75 L 355 75 M 338 75 L 336 95 M 348 75 L 350 95" />
    <!-- Square root -->
    <path d="M 60 170 L 68 170 L 76 190 L 88 155 L 115 155" />
    <circle cx="100" cy="172" r="5" />

    <!-- Cube 3D isometric -->
    <path d="M 270 170 L 295 155 L 320 170 L 295 185 Z" />
    <path d="M 270 170 L 270 200 L 295 215 L 295 185" />
    <path d="M 320 170 L 320 200 L 295 215" />

