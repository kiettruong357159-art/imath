<body>
  <main class="tool" aria-label="Máy sinh đề Toán tiểu học">
    <section class="settings panel" aria-label="Cài đặt đề">
      <div class="brand-line"><div class="brand-mark">+</div><div><h1>Máy sinh đề Toán</h1><p>Tạo đề mới, in ngay và làm lại tuỳ thích</p></div></div>
      <div class="fields">
        <div class="field"><label for="grade">Lớp</label><select id="grade" aria-label="Chọn lớp"><option value="1">Lớp 1</option><option value="2">Lớp 2</option><option value="3">Lớp 3</option><option value="4">Lớp 4</option><option value="5">Lớp 5</option></select></div>
        <div class="field"><label for="topic">Dạng bài</label><select id="topic" aria-label="Chọn dạng bài"></select></div>
        <div class="field"><label for="difficulty">Độ khó</label><select id="difficulty" aria-label="Chọn độ khó"><option value="0">Dễ — một phép tính cơ bản</option><option value="1" selected>Vừa — thêm bước suy nghĩ</option><option value="2">Khó — nhiều bước tính</option><option value="3">Rất khó — tổng hợp nhiều phép tính</option></select></div>
        <div class="field"><label for="count">Số câu</label><select id="count" aria-label="Chọn số câu"><option value="10">10 câu</option><option value="20" selected>20 câu</option><option value="30">30 câu</option><option value="custom">Tự nhập</option></select><div class="custom-wrap" id="customWrap" hidden><input id="customCount" type="number" inputmode="numeric" min="1" max="50" value="20" aria-label="Nhập số câu từ 1 đến 50"></div></div>
        <div class="field"><label>Tuỳ chọn</label><div class="count-row"><label class="choice"><input id="showAnswers" type="checkbox">Hiện đáp án</label><label class="choice"><input id="vertical" type="checkbox">Đặt tính dọc</label></div></div>
      </div>
      <div class="actions"><button class="btn btn-primary" id="generate" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4a8 8 0 1 0 7.45 11H17l4-4 4 4h-2.38A10 10 0 1 1 12 2v2z" transform="scale(.8) translate(3 3)"/></svg>Tạo đề</button><button class="btn btn-secondary" id="print" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2h12v5H6V2zm11 12H7v7h10v-7zM19 8H5a3 3 0 0 0-3 3v6h3v-5h14v5h3v-6a3 3 0 0 0-3-3z"/></svg>In đề</button></div>
    </section>
    <section class="worksheet" id="worksheet" aria-live="polite">
      <div class="empty" id="empty"><div><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h11l3 3v15H5V3zm2 2v14h10V7h-4V5H7zm2 4h6v2H9V9zm0 4h6v2H9v-2z"/></svg><strong>Sẵn sàng tạo đề mới</strong><div>Chọn lớp, dạng bài và số câu ở phía trên.</div></div></div>
    </section>
    <footer class="status" id="status"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm1 11h5v2h-7V7h2v6z"/></svg><div><strong>Chưa có đề.</strong> Bấm “Tạo đề” để bắt đầu.</div><span>Không lưu dữ liệu</span></footer>
  </main>
  <script>
  (()=>{
    'use strict';
    const topics={
      1:[['add10','Cộng trong phạm vi 10'],['sub10','Trừ trong phạm vi 10'],['add100','Cộng trong phạm vi 100 (không nhớ)'],['sub100','Trừ trong phạm vi 100 (không nhớ)']],
      2:[['add100carry','Cộng có nhớ trong phạm vi 100'],['sub100borrow','Trừ có nhớ trong phạm vi 100'],['add1000carry','Cộng có nhớ trong phạm vi 1000'],['sub1000borrow','Trừ có nhớ trong phạm vi 1000'],['mul25','Nhân với 2 và 5'],['div25','Chia cho 2 và 5']],
      3:[['mul29','Bảng nhân từ 2 đến 9'],['div29','Bảng chia từ 2 đến 9'],['mul2d','Nhân số có 2–3 chữ số với 1 chữ số'],['div1d','Chia số có 2–3 chữ số cho 1 chữ số']],
      4:[['mul2digits','Nhân với số có 2 chữ số'],['div2digits','Chia cho số có 2 chữ số'],['addbig','Cộng, trừ số có nhiều chữ số']],
      5:[['decimalAdd','Cộng số thập phân'],['decimalSub','Trừ số thập phân'],['decimalMul10','Nhân số thập phân với 10, 100, 1000'],['percent','Tìm phần trăm của một số'],['fractionParts','Phân số: tử số và mẫu số'],['fractionAdd','Cộng, trừ phân số'],['fractionCompare','So sánh phân số'],['fractionOfNumber','Tìm phân số của một số'],['wordProblem','Toán có lời văn nhiều bước']],
    };
    const $=id=>document.getElementById(id); const state={questions:[],settings:null};
    const rnd=(min,max)=>Math.floor(Math.random()*(max-min+1))+min;
    const fmt=n=>typeof n==='number'?(Number.isInteger(n)?String(n):String(Number(n.toFixed(2))).replace('.',',')):String(n);
    const gcd=(a,b)=>b?gcd(b,a%b):a;
    function updateTopics(){const grade=$('grade').value; $('topic').innerHTML=topics[grade].map(([v,t])=>`<option value="${v}">${t}</option>`).join('');}
    function setCustom(){ $('customWrap').hidden=$('count').value!=='custom'; }
    function countValue(){const v=$('count').value==='custom'?Number($('customCount').value):Number($('count').value);return Math.max(1,Math.min(50,Number.isFinite(v)?v:20));}
    function math(a,op,b,answer,vertical=true){return{a,b,op,answer,expression:`${fmt(a)} ${op} ${fmt(b)}`,vertical};}
    function noCarryAdd(limit){let a,b;do{a=rnd(11,limit);b=rnd(11,limit);const as=String(a).padStart(2,'0'),bs=String(b).padStart(2,'0');if(a+b<=limit&&[0,1].every(i=>Number(as[i])+Number(bs[i])<10))return math(a,'+',b,a+b)}while(true)}
    function noBorrowSub(limit){let a,b;do{a=rnd(11,limit);b=rnd(2,a-1);const as=String(a).padStart(2,'0'),bs=String(b).padStart(2,'0');if([0,1].every(i=>Number(as[i])>=Number(bs[i])))return math(a,'−',b,a-b)}while(true)}
    function carryAdd(limit){let a,b;do{a=rnd(Math.ceil(limit*.12),Math.floor(limit*.75));b=rnd(11,Math.floor(limit*.75));if(a+b<=limit&&a%10+b%10>=10)return math(a,'+',b,a+b)}while(true)}
    function borrowSub(limit){let a,b;do{a=rnd(Math.ceil(limit*.25),limit);b=rnd(11,a-1);if(a%10<b%10)return math(a,'−',b,a-b)}while(true)}
    function fraction(n,d){const g=gcd(n,d);return `${n/g}/${d/g}`;}
    function generateRaw(topic){
      let a,b,d,base;const level=Number($('difficulty').value);
      switch(topic){
        case'add10': a=rnd(1,9);b=rnd(1,10-a);return math(a,'+',b,a+b);
        case'sub10': a=rnd(2,10);b=rnd(1,a-1);return math(a,'−',b,a-b);
        case'add100': return noCarryAdd(99); case'sub100': return noBorrowSub(99);
        case'add100carry': return carryAdd(100); case'sub100borrow': return borrowSub(100);
        case'add1000carry': return carryAdd(999); case'sub1000borrow': return borrowSub(999);
        case'mul25': a=rnd(2,5);b=rnd(2,10);return math(a,'×',b,a*b);
        case'div25': b=[2,5][rnd(0,1)];a=b*rnd(2,20);return math(a,':',b,a/b,false);
        case'mul29': a=rnd(2,9);b=rnd(2,10);return math(a,'×',b,a*b);
        case'div29': b=rnd(2,9);a=b*rnd(2,10);return math(a,':',b,a/b,false);
        case'mul2d': a=rnd(12,999);b=rnd(2,9);return math(a,'×',b,a*b);
        case'div1d': b=rnd(2,9);a=b*rnd(12,111);return math(a,':',b,a/b,false);
        case'mul2digits': a=rnd(120,9999);b=rnd(12,45);return math(a,'×',b,a*b);
        case'div2digits': b=rnd(12,45);a=b*rnd(12,99);return math(a,':',b,a/b,false);
        case'addbig': if(Math.random()<.5){a=rnd(10000,899999);b=rnd(1000,99999);return math(a,'+',b,a+b)}a=rnd(10000,999999);b=rnd(1000,a-1);return math(a,'−',b,a-b);
        case'decimalAdd': a=rnd(12,899)/10;b=rnd(11,499)/10;return math(a,'+',b,Number((a+b).toFixed(1)));
        case'decimalSub': a=rnd(30,999)/10;b=rnd(11,Math.floor(a*10)-1)/10;return math(a,'−',b,Number((a-b).toFixed(1)));
        case'decimalMul10': a=rnd(12,999)/10;b=[10,100,1000][rnd(0,2)];return math(a,'×',b,a*b,false);
        case'percent': base=[100,200,300,400,500,600,800,1000][rnd(0,7)];d=[5,10,20,25,50][rnd(0,4)];return{a:base,b:d,op:'%',answer:base*d/100,expression:`${d}% của ${fmt(base)}`,vertical:false};
        case'fractionParts': {
          const den=rnd(level<2?3:5,level===3?20:12),num=rnd(1,den-1);
          if(level===0)return{op:'text',answer:num,expression:`Trong phân số ${num}/${den}, tử số là`,vertical:false};
          if(level===1)return{op:'text',answer:den,expression:`Trong phân số ${num}/${den}, mẫu số là`,vertical:false};
          return{op:'text',answer:`${num}/${den}`,expression:`Viết phân số có tử số là ${num} và mẫu số là ${den}`,vertical:false};
        }
        case'fractionAdd': {
          if(level===0){d=rnd(3,10);a=rnd(1,d-2);b=rnd(1,d-a-1);return{op:'fraction',answer:fraction(a+b,d),expression:`${a}/${d} + ${b}/${d}`,vertical:false};}
          if(level===1){d=rnd(2,6);const k=rnd(2,4),n=rnd(1,d-1),m=rnd(1,k-1);return{op:'fraction',answer:fraction(n*k+m,d*k),expression:`${n}/${d} + ${m}/${d*k}`,vertical:false};}
          d=rnd(2,8);const e=rnd(2,8);a=rnd(1,d-1);b=rnd(1,e-1);if(level===2)return{op:'fraction',answer:fraction(a*e+b*d,d*e),expression:`${a}/${d} + ${b}/${e}`,vertical:false};
          const c=rnd(1,a);return{op:'fraction',answer:fraction(a*e+b*d-c*e,d*e),expression:`${a}/${d} + ${b}/${e} − ${c}/${d}`,vertical:false};
        }
        case'fractionCompare': {
          d=rnd(3,level===3?15:10);const e=level===0?d:rnd(3,level===3?15:10);a=rnd(1,d-1);b=rnd(1,e-1);const sign=a*e===b*d?'=':a*e>b*d?'>':'<';return{op:'fraction',answer:sign,expression:`Điền dấu >, < hoặc = : ${a}/${d} … ${b}/${e}`,vertical:false};
        }
        case'fractionOfNumber': {
          d=rnd(2,level===3?10:6);a=rnd(1,d-1);const unit=rnd(level===0?3:8,level===3?30:18);base=d*unit;return{op:'fraction',answer:a*unit,expression:`${a}/${d} của ${base}`,vertical:false};
        }
        case'wordProblem': {
          if(level===0){base=rnd(10,99)*3;return{op:'text',answer:base/3,expression:`Một lớp có ${base} học sinh. Số học sinh nữ bằng 1/3 số học sinh cả lớp. Lớp có bao nhiêu học sinh nữ?`,vertical:false};}
          if(level===1){base=rnd(12,80)*10;const sold=base*2/5;return{op:'text',answer:base-sold,expression:`Một thư viện có ${base} quyển sách. Thư viện cho mượn 2/5 số sách. Hỏi thư viện còn lại bao nhiêu quyển sách?`,vertical:false};}
          if(level===2){base=rnd(12,99)*24;const first=base*3/8,more=rnd(2,8)*6;return{op:'text',answer:base-first+more,expression:`Một cửa hàng có ${base} quyển vở. Buổi sáng bán 3/8 số vở, sau đó nhập thêm ${more} quyển. Hỏi cửa hàng có tất cả bao nhiêu quyển vở?`,vertical:false};}
          base=rnd(12,99)*20;const percent=20;const after=base*(100-percent)/100;const more=rnd(3,10)*10;return{op:'text',answer:after+more,expression:`Một kho có ${base} kg gạo. Kho đã bán ${percent}% số gạo, rồi nhập thêm ${more} kg. Hỏi kho có bao nhiêu ki-lô-gam gạo?`,vertical:false};
        }
        default:return math(2,'+',3,5);
      }
    }
    function expressionQuestion(expression,answer){return{expression,answer,vertical:false};}
    function hardenQuestion(q,level){
      if(level===0)return q;
      const ceiling=q.answer<=10?5:q.answer<=100?(level===1?12:30):(level===1?30:90);
      const extra=()=>rnd(level===1?1:3,ceiling);
      if(q.op==='+'){
        const values=[];let answer=q.answer;
        for(let i=0;i<level;i++){const n=extra();values.push(n);answer+=n;}
        return expressionQuestion(`${q.expression} + ${values.join(' + ')}`,answer);
      }
      if(q.op==='−'){
        const values=[];let answer=q.answer;
        for(let i=0;i<level;i++){const max=Math.max(1,Math.floor(answer/(level-i+1)));const n=rnd(1,max);values.push(n);answer-=n;}
        if(level===3){const plus=extra();return expressionQuestion(`${q.expression} − ${values.join(' − ')} + ${plus}`,answer+plus);}
        return expressionQuestion(`${q.expression} − ${values.join(' − ')}`,answer);
      }
      if(q.op==='×'){
        const first=extra();
        if(level===1)return expressionQuestion(`${q.expression} + ${first}`,q.answer+first);
        const second=level===2?rnd(2,9):extra();
        if(level===2)return expressionQuestion(`${q.expression} − ${Math.min(first,Math.max(1,q.answer-1))} + ${second}`,q.answer-Math.min(first,Math.max(1,q.answer-1))+second);
        return expressionQuestion(`${q.expression} + ${first} × ${second}`,q.answer+first*second);
      }
      if(q.op===':'){
        const first=extra();
        if(level===1)return expressionQuestion(`${q.expression} + ${first}`,q.answer+first);
        const second=level===2?rnd(2,9):extra();
        if(level===2)return expressionQuestion(`${q.expression} + ${first} × ${second}`,q.answer+first*second);
        const third=rnd(2,Math.max(3,first));return expressionQuestion(`${q.expression} + ${first} × ${second} − ${third}`,q.answer+first*second-third);
      }
      if(q.op==='%'){
        const first=extra();
        if(level===1)return expressionQuestion(`${q.expression} + ${first}`,q.answer+first);
        const second=level===2?rnd(2,9):extra();
        return expressionQuestion(`${q.expression} + ${first} × ${second}`,q.answer+first*second);
      }
      return q;
    }
    function generate(topic){return hardenQuestion(generateRaw(topic),Number($('difficulty').value));}
    function verticalMarkup(q,show){if(!q.vertical||!$('vertical').checked)return `<span class="math">${q.expression} = ${show?`<span class="answer">${fmt(q.answer)}</span>`:'<span class="answer-line"></span>'}</span>`;return `<span class="vertical"><span>${fmt(q.a)}</span><span class="opline"><b class="op">${q.op}</b>${fmt(q.b)}</span><span class="vanswer ${show?'show':''}">${show?fmt(q.answer):''}</span></span>`;}
    function render(){const show=$('showAnswers').checked,grade=$('grade').value,topicText=$('topic').selectedOptions[0].text,levelText=$('difficulty').selectedOptions[0].text.split(' — ')[0],number=state.questions.length; const cards=state.questions.map((q,i)=>`<article class="question"><span class="qnum">${i+1}</span><div>${verticalMarkup(q,show)}</div></article>`).join('');const answers=state.questions.map((q,i)=>`<div><b>${i+1}.</b> ${fmt(q.answer)}</div>`).join('');const empty=$('empty');if(empty)empty.style.display='none';$('worksheet').innerHTML=`<div class="sheet-head"><div><h2>Đề Toán lớp ${grade}</h2><p>${topicText} · Mức ${levelText} · ${number} câu · Ngày: ……/……/………</p></div><span class="badge">${show?'Có đáp án':'Học sinh tự làm'}</span></div><div class="questions">${cards}</div><section class="print-only"><h2>Đáp án — Đề Toán lớp ${grade}</h2><div class="answers-print">${answers}</div></section>`;}
    function makeSheet(){const total=countValue(),topic=$('topic').value,levelText=$('difficulty').selectedOptions[0].text.split(' — ')[0],unique=new Set(),questions=[];let safety=0;while(questions.length<total&&safety<total*80){const q=generate(topic),key=q.expression;if(!unique.has(key)){unique.add(key);questions.push(q)}safety++}state.questions=questions;state.settings={grade:$('grade').value,topic,difficulty:$('difficulty').value};render();$('status').innerHTML=`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm1 11h5v2h-7V7h2v6z"/></svg><div><strong>Đã tạo ${questions.length} câu mức ${levelText}.</strong> Bấm “Tạo đề” lần nữa để đổi số, giữ nguyên cài đặt.</div><span>Độc lập · Không lưu dữ liệu</span>`;}
    $('grade').addEventListener('change',updateTopics);$('count').addEventListener('change',setCustom);$('generate').addEventListener('click',makeSheet);$('print').addEventListener('click',()=>{if(!state.questions.length){makeSheet()}window.print()});$('showAnswers').addEventListener('change',()=>{if(state.questions.length)render()});$('vertical').addEventListener('change',()=>{if(state.questions.length)render()});$('customCount').addEventListener('change',()=>{$('customCount').value=countValue()});
    updateTopics();
  })();
