<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <g fill="none" stroke="#0284c7" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" opacity="0.055">
